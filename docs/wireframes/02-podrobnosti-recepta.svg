<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><style>text{font-family:Arial,sans-serif;fill:#233044} .small{font-size:15px}.body{font-size:18px}.head{font-size:23px;font-weight:700}.muted{fill:#66758a}.box{fill:#fff;stroke:#a7b1bf;stroke-width:2}.shade{fill:#edf1f5;stroke:#a7b1bf;stroke-width:2}.dark{fill:#25364a}.white{fill:#fff}.line{stroke:#a7b1bf;stroke-width:2}</style><rect width="1200" height="760" fill="#f8fafc"/><rect x="25" y="20" width="1150" height="75" rx="8" class="box"/><text x="48" y="67" class="head">TasteNest</text><text x="700" y="65" class="body">Recepti     Moj načrt     Priljubljeni     Prijava</text><text x="40" y="145" class="head">Podrobnosti recepta: Testenine</text><rect x="40" y="172" width="450" height="300" rx="8" class="shade"/><text x="210" y="322" class="head">SLIKA</text><rect x="515" y="172" width="640" height="300" rx="8" class="box"/><text x="538" y="215" class="head">Testenine</text><text x="538" y="250" class="small">Avtor: Ana   |   30 min   |   Ocena: 4,5 / 5</text><text x="538" y="295" class="body">Porcije:   [ − ]     2     [ + ]</text><text x="538" y="339" class="body">Sestavine:</text><text x="558" y="373" class="small">• 200 g testenin</text><text x="558" y="400" class="small">• 150 ml omake</text><text x="558" y="427" class="small">• 1 kos čebule</text><rect x="40" y="492" width="700" height="220" rx="8" class="box"/><text x="60" y="526" class="head">Postopek priprave</text><text x="60" y="566" class="body">1. Pripravi sestavine.</text><text x="60" y="600" class="body">2. Skuhaj in združi.</text><text x="60" y="650" class="small">Komentarji in ocene pod postopkom ...</text><rect x="760" y="492" width="395" height="220" rx="8" class="box"/><text x="782" y="527" class="head">Dejanja</text><rect x="780" y="550" width="350" height="46" rx="8" class="shade"/><text x="812" y="579" class="small">♡ Dodaj med priljubljene</text><rect x="780" y="611" width="350" height="48" rx="8" class="shade"/><text x="816" y="641" class="small">+ Dodaj v tedenski načrt</text></svg>