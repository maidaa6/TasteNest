services:
  db:
    image: postgres:16-alpine
    container_name: tastenest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tastenest
      POSTGRES_PASSWORD: tastenest
      POSTGRES_DB: tastenest
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tastenest -d tastenest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
