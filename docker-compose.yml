services:
  db:
    image: postgres:16-alpine
    container_name: tastenest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tastenest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastavite POSTGRES_PASSWORD v .env (glej .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-tastenest}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
